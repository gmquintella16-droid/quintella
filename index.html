<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Quintella Diamond - Oficial</title>
    <style>
        :root { --ouro: #d4af37; --fundo-app: #f4f4f4; --verde: #2ecc71; --azul: #3498db; --vermelho: #e74c3c; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--fundo-app); margin: 0; padding: 10px; padding-top: env(safe-area-inset-top); }
        .container { max-width: 100%; margin: 0 auto; padding-bottom: 80px; }
        h1 { color: #000; text-align: center; text-transform: uppercase; font-size: 1.3rem; margin: 15px 0; font-weight: 800; }
        .backup-area { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-backup { background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 8px; flex: 1; font-size: 0.7rem; font-weight: bold; cursor: pointer; }
        .resumo-topo { background: #fff; padding: 12px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 0.75rem; text-align: center; border: 1px solid #eee; }
        .resumo-topo span { display: block; color: var(--ouro); font-size: 0.9rem; font-weight: bold; }
        .menu { display: flex; gap: 4px; margin-bottom: 15px; position: sticky; top: 0; background: var(--fundo-app); padding: 10px 0; z-index: 100; overflow-x: auto; }
        .btn-menu { background: #fff; border: 1px solid #ddd; color: #888; padding: 10px 5px; border-radius: 8px; flex: 1; font-weight: bold; font-size: 0.55rem; text-transform: uppercase; white-space: nowrap; }
        .btn-menu.active { background: var(--ouro); color: white; border-color: var(--ouro); }
        .secao { background: #1a1a1a; padding: 12px; border-radius: 15px; display: none; color: #fff; }
        .active { display: block; }
        .form-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        label { display: block; font-size: 9px; color: var(--ouro); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        input, select { background: #fff; border: 1px solid #ddd; color: #333; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
        .btn-add { background: var(--verde); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; }
        table { width: 100%; border-collapse: collapse; color: #fff; font-size: 10px; }
        th { text-align: left; color: var(--ouro); padding: 5px 2px; border-bottom: 1px solid #333; font-size: 8px; }
        td { padding: 8px 2px; border-bottom: 1px solid #222; }
        .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid #444; }
        .grid-catalogo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .card-cat { background: #fff; color: #000; border-radius: 10px; overflow: hidden; text-align: center; padding-bottom: 8px; }
        .card-cat img { width: 100%; height: 120px; object-fit: cover; }
        .btn-del { background: transparent; color: var(--vermelho); border: 1px solid var(--vermelho); width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
    </style>
</head>
<body>

<div class="container">
    <h1>Quintella Diamond 💎</h1>
    <div class="backup-area">
        <button class="btn-backup" onclick="exportar()">📥 SALVAR BACKUP</button>
        <button class="btn-backup" onclick="document.getElementById('imp').click()">📤 ABRIR MEU ARQUIVO</button>
        <input type="file" id="imp" style="display:none" onchange="importar(this)">
    </div>
    
    <div class="resumo-topo">
        <div>EMBALAGEM/UN<span id="fixo">R$ 0,00</span></div>
        <div>ESTOQUE TOTAL<span id="totalEst">0</span></div>
    </div>

    <div class="menu">
        <button class="btn-menu active" onclick="trocar(1, this)">CUSTOS</button>
        <button class="btn-menu" onclick="trocar(2, this)">ESTOQUE</button>
        <button class="btn-menu" onclick="trocar(4, this)">CATÁLOGO</button>
        <button class="btn-menu" onclick="trocar(3, this)">SALÕES</button>
    </div>

    <div id="aba1" class="secao active">
        <div class="form-box">
            <label>Descrição</label><input type="text" id="c_nome">
            <label>Valor Total (R$)</label><input type="number" id="c_valor">
            <label>Qtd de Peças</label><input type="number" id="c_qtd" value="1">
            <button class="btn-add" onclick="addC()">+ ADICIONAR CUSTO</button>
        </div>
        <table>
            <thead><tr><th>DESCRIÇÃO</th><th>TOTAL</th><th>QTD</th><th>UNIT.</th><th></th></tr></thead>
            <tbody id="listaC"></tbody>
        </table>
    </div>

    <div id="aba2" class="secao">
        <div class="form-box">
            <label>Foto</label><input type="file" id="p_foto" accept="image/*">
            <label>Modelo/Nome</label><input type="text" id="p_nome">
            <label>Qtd</label><input type="number" id="p_qtd" value="1">
            <label>Custo Unitário (R$)</label><input type="number" id="p_custo">
            <label>Preço Venda (R$)</label><input type="number" id="p_venda">
            <button class="btn-add" onclick="addE()">📦 SALVAR NO ESTOQUE</button>
        </div>
        <table>
            <thead><tr><th>FOTO</th><th>NOME/ID</th><th>QTD</th><th>VENDA</th><th></th></tr></thead>
            <tbody id="listaE"></tbody>
        </table>
    </div>

    <div id="aba4" class="secao">
        <div class="grid-catalogo" id="listaCat"></div>
    </div>

    <div id="aba3" class="secao">
        <div id="listaS"></div>
    </div>
</div>

<script>
    // ESTAS SÃO AS CHAVES EXATAS DO SEU ARQUIVO (dC, dE, dS)
    let dC = JSON.parse(localStorage.getItem('dC')) || [];
    let dE = JSON.parse(localStorage.getItem('dE')) || [];
    let dS = JSON.parse(localStorage.getItem('dS')) || {};

    const m = v => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

    function salvarTudo() {
        localStorage.setItem('dC', JSON.stringify(dC));
        localStorage.setItem('dE', JSON.stringify(dE));
        localStorage.setItem('dS', JSON.stringify(dS));
    }

    function trocar(n, btn) {
        document.querySelectorAll('.secao').forEach(s => s.classList.remove('active'));
        document.querySelectorAll('.btn-menu').forEach(b => b.classList.remove('active'));
        document.getElementById('aba'+n).classList.add('active');
        btn.classList.add('active');
        render();
    }

    function importar(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                // Ele vai ler os seus 68 itens aqui:
                dC = data.dC || [];
                dE = data.dE || [];
                dS = data.dS || {};
                salvarTudo();
                render();
                alert("✅ Arquivo com " + dE.length + " itens carregado com sucesso!");
            } catch (err) { alert("Erro ao ler o arquivo."); }
        };
        reader.readAsText(input.files[0]);
    }

    function exportar() {
        const blob = new Blob([JSON.stringify({dC, dE, dS})], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'Backup_Quintella.json';
        a.click();
    }

    function getEmbalagemUn() {
        let total = 0;
        dC.forEach(c => total += (c.v / c.q));
        return total || 0;
    }

    function addC() {
        let n = document.getElementById('c_nome').value, v = parseFloat(document.getElementById('c_valor').value), q = parseInt(document.getElementById('c_qtd').value);
        if(n && v >= 0) { dC.push({n, v, q}); salvarTudo(); render(); }
    }

    async function addE() {
        let n = document.getElementById('p_nome').value, q = parseInt(document.getElementById('p_qtd').value), c = parseFloat(document.getElementById('p_custo').value), v = parseFloat(document.getElementById('p_venda').value), f = document.getElementById('p_foto').files[0];
        let id = Math.floor(1000 + Math.random() * 9000);
        let b64 = f ? await comprimir(f) : "";
        dE.push({id, n, q, c, v, f: b64});
        salvarTudo(); render();
    }

    function render() {
        let emb = getEmbalagemUn();
        document.getElementById('fixo').innerText = m(emb);
        
        let htmlC = ''; dC.forEach((c, i) => htmlC += `<tr><td>${c.n}</td><td>${m(c.v)}</td><td>${c.q}</td><td>${m(c.v/c.q)}</td><td><button class="btn-del" onclick="dC.splice(${i},1);salvarTudo();render()">X</button></td></tr>`);
        document.getElementById('listaC').innerHTML = htmlC;

        let htmlE = '', htmlCat = '', tot = 0;
        dE.forEach((p, i) => {
            tot += p.q;
            htmlE += `<tr><td><img src="${p.f}" class="thumb"></td><td>${p.n}<br><small>ID: ${p.id}</small></td><td>${p.q}</td><td>${m(p.v)}</td><td><button class="btn-del" onclick="dE.splice(${i},1);salvarTudo();render()">X</button></td></tr>`;
            htmlCat += `<div class="card-cat"><img src="${p.f}"><div>${p.n}<br><b>ID: ${p.id}</b><br><b>${m(p.v)}</b></div></div>`;
        });
        document.getElementById('listaE').innerHTML = htmlE;
        document.getElementById('listaCat').innerHTML = htmlCat;
        document.getElementById('totalEst').innerText = tot;
    }

    async function comprimir(f) {
        return new Promise(res => {
            const r = new FileReader(); r.readAsDataURL(f);
            r.onload = e => {
                const img = new Image(); img.src = e.target.result;
                img.onload = () => {
                    const c = document.createElement('canvas');
                    const ctx = c.getContext('2d');
                    c.width = 400; c.height = 400;
                    ctx.drawImage(img, 0, 0, 400, 400);
                    res(c.toDataURL('image/jpeg', 0.7));
                }
            }
        });
    }
    render();
</script>
</body>
</html>
