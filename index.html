<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0, viewport-fit=cover">
    <title>Quintella Diamond</title>
    <style>
        :root { --ouro: #d4af37; --fundo-app: #f4f4f4; --verde: #2ecc71; --azul: #3498db; --vermelho: #e74c3c; --roxo: #9b59b6; }
        body { font-family: -apple-system, system-ui, sans-serif; background: var(--fundo-app); margin: 0; padding: 10px; padding-top: env(safe-area-inset-top); }
        .container { max-width: 100%; margin: 0 auto; padding-bottom: 80px; box-sizing: border-box; }
        h1 { color: #000; text-align: center; text-transform: uppercase; font-size: 1.3rem; margin: 15px 0; letter-spacing: 1px; font-weight: 800; }
        .backup-area { display: flex; gap: 8px; margin-bottom: 15px; }
        .btn-backup { background: #fff; border: 1px solid #ddd; padding: 10px; border-radius: 8px; flex: 1; font-size: 0.7rem; font-weight: bold; }
        .resumo-topo { background: #fff; padding: 12px; border-radius: 12px; display: flex; justify-content: space-around; margin-bottom: 20px; font-size: 0.75rem; text-align: center; border: 1px solid #eee; }
        .resumo-topo span { display: block; color: var(--ouro); font-size: 0.9rem; font-weight: bold; }
        .menu { display: flex; gap: 4px; margin-bottom: 15px; position: sticky; top: 0; background: var(--fundo-app); padding: 10px 0; z-index: 100; overflow-x: auto; }
        .btn-menu { background: #fff; border: 1px solid #ddd; color: #888; padding: 10px 5px; border-radius: 8px; flex: 1; font-weight: bold; font-size: 0.55rem; text-transform: uppercase; white-space: nowrap; }
        .btn-menu.active { background: var(--ouro); color: white; border-color: var(--ouro); }
        .secao { background: #1a1a1a; padding: 12px; border-radius: 15px; display: none; color: #fff; overflow: hidden; }
        .active { display: block; }
        .form-box { background: rgba(255,255,255,0.05); padding: 12px; border-radius: 12px; margin-bottom: 15px; }
        label { display: block; font-size: 9px; color: var(--ouro); margin-bottom: 4px; font-weight: bold; text-transform: uppercase; }
        input, select { background: #fff; border: 1px solid #ddd; color: #333; padding: 12px; border-radius: 8px; width: 100%; box-sizing: border-box; font-size: 15px; margin-bottom: 10px; }
        .btn-add { background: var(--verde); color: white; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; cursor: pointer; font-size: 0.9rem; }
        table { width: 100%; border-collapse: collapse; color: #fff; font-size: 10px; table-layout: fixed; }
        th { text-align: left; color: var(--ouro); padding: 5px 2px; border-bottom: 1px solid #333; font-size: 8px; }
        td { padding: 8px 2px; border-bottom: 1px solid #222; vertical-align: middle; }
        .input-edit { width: 100%; background: #000; color: #fff; border: 1px solid #444; padding: 4px; border-radius: 4px; font-size: 10px; text-align: center; }
        .footer-custos { background: #000; color: var(--verde); font-weight: bold; text-align: left; padding: 12px 15px; border-radius: 0 0 10px 10px; margin-top: -1px; font-size: 12px; border: 1px solid #333; }
        .thumb-edit-btn { background: none; border: none; padding: 0; position: relative; width: 40px; height: 40px; cursor: pointer; }
        .thumb { width: 40px; height: 40px; border-radius: 6px; object-fit: cover; border: 1px solid #444; }
        .edit-badge { position: absolute; bottom: -2px; right: -2px; background: var(--ouro); color: black; font-size: 8px; width: 14px; height: 14px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 1px solid #000; }
        .grid-catalogo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
        .card-cat { background: #fff; color: #000; border-radius: 10px; overflow: hidden; text-align: center; padding-bottom: 8px; cursor: pointer; }
        .card-cat img { width: 100%; height: 120px; object-fit: cover; }
        .carrinho-item { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin-bottom: 8px; border-left: 3px solid var(--roxo); }
        .cart-info { flex: 1; font-size: 11px; }
        .cart-total-box { background: #000; border: 2px solid var(--verde); border-radius: 12px; padding: 15px; text-align: center; margin: 15px 0; }
        .salao-container { background: #222; border-radius: 12px; margin-bottom: 15px; border: 1px solid #333; overflow: hidden; }
        .salao-header { padding: 12px; background: #2a2a2a; color: #fff; display: flex; justify-content: space-between; font-weight: bold; font-size: 0.9rem; }
        .item-salao { display: flex; align-items: center; gap: 8px; border-bottom: 1px solid #333; padding: 10px 5px; }
        .item-info { flex: 1; }
        .nome-label { font-weight: bold; color: #fff; font-size: 12px; display: block; }
        .valor-label { color: var(--ouro); font-size: 10px; display: block; margin: 2px 0; }
        .unitario-label { color: #aaa; font-size: 10px; display: block; margin: 2px 0; }
        .enviado-label { color: var(--ouro); font-size: 10px; font-weight: bold; }
        .input-venda { width: 45px !important; background: #000 !important; color: #fff !important; border: 1px solid var(--verde) !important; padding: 6px !important; text-align: center; border-radius: 4px; margin: 0 !important; }
        .btn-fechar { background: var(--ouro); color: #000; border: none; padding: 15px; border-radius: 10px; font-weight: bold; width: 100%; margin-top: 10px; cursor: pointer; text-transform: uppercase; font-size: 0.8rem; }
        .btn-whats { background: #25d366; color: #fff; border: none; padding: 10px; border-radius: 8px; font-weight: bold; width: 100%; margin-top: 5px; cursor: pointer; text-transform: uppercase; font-size: 0.7rem; }
        .btn-del { background: transparent; color: var(--vermelho); border: 1px solid var(--vermelho); width: 26px; height: 26px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 12px; }
        #modalFoto { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        #imgGrande { max-width: 100%; max-height: 70%; border-radius: 10px; border: 2px solid var(--ouro); object-fit: contain; }
        #infoGrande { color: white; text-align: center; margin-top: 15px; }
    </style>
</head>
<body>

<div id="modalFoto" onclick="this.style.display='none'">
    <img id="imgGrande" src="">
    <div id="infoGrande"></div>
    <button style="margin-top:20px; background:var(--vermelho); color:white; border:none; padding:10px 30px; border-radius:8px; font-weight:bold;">FECHAR</button>
</div>

<div class="container">
    <h1>Quintella Diamond 💎</h1>
    <div class="backup-area">
        <button class="btn-backup" onclick="exportar()">📥 BACKUP</button>
        <button class="btn-backup" onclick="document.getElementById('imp').click()">📤 ABRIR</button>
        <input type="file" id="imp" style="display:none" onchange="importar(this)">
    </div>
    
    <input type="file" id="edit_foto_input" style="display:none" accept="image/*">
    
    <div class="resumo-topo">
        <div>EMBALAGEM/UN<span id="fixo">R$ 0,00</span></div>
        <div>ESTOQUE TOTAL<span id="totalEst">0</span></div>
    </div>

    <div class="menu">
        <button class="btn-menu active" onclick="trocar(1, this)">CUSTOS</button>
        <button class="btn-menu" onclick="trocar(2, this)">ESTOQUE</button>
        <button class="btn-menu" onclick="trocar(4, this)">CATÁLOGO</button>
        <button class="btn-menu" onclick="trocar(5, this)" style="background:var(--roxo); color:white">💸 VENDA</button>
        <button class="btn-menu" onclick="trocar(3, this)">SALÕES</button>
    </div>

    <div id="aba1" class="secao active">
        <div class="form-box">
            <label>Descrição</label><input type="text" id="c_nome">
            <label>Valor Total (R$)</label><input type="number" id="c_valor">
            <label>Qtd de Peças</label><input type="number" id="c_qtd" value="1">
            <button class="btn-add" onclick="addC()">+ ADICIONAR NOVO CUSTO</button>
        </div>
        <table>
            <thead><tr><th style="width:35%; padding-left:10px">DESCRIÇÃO</th><th style="width:22%">TOTAL R$</th><th style="width:15%">QTD</th><th style="width:18%">UNIT.</th><th style="width:10%"></th></tr></thead>
            <tbody id="listaC"></tbody>
        </table>
        <div class="footer-custos" id="subtotal_custos">SUBTOTAL INVESTIDO: R$ 0,00</div>
    </div>

    <div id="aba2" class="secao">
        <div class="form-box">
            <label>Foto</label><input type="file" id="p_foto" accept="image/*">
            <label>Modelo</label><input type="text" id="p_nome">
            <label>Qtd</label><input type="number" id="p_qtd" value="1">
            <label>Custo Compra (R$)</label><input type="number" id="p_custo" oninput="sugerir()">
            <label>% Margem</label><input type="number" id="p_margem" value="70" oninput="sugerir()">
            <label>Preço Venda</label><input type="number" id="p_venda">
            <button class="btn-add" onclick="addE()">📦 SALVAR NO ESTOQUE</button>
        </div>
        <table>
            <thead><tr><th style="width:45px">FOTO</th><th style="width:32%">NOME</th><th style="width:25px">QTD</th><th style="width:48px">CUSTO</th><th style="width:48px">VENDA</th><th style="width:32px">%</th><th style="width:32px"></th></tr></thead>
            <tbody id="listaE"></tbody>
        </table>
    </div>

    <div id="aba4" class="secao">
        <div class="form-box"><label style="color:white">Simular Comissão Cliente (%)</label><input type="number" id="cat_com" value="30" oninput="render()"></div>
        <div class="grid-catalogo" id="listaCat"></div>
    </div>

    <div id="aba5" class="secao">
        <div class="form-box">
            <label>Digitar ID da Peça</label><input type="number" id="busca_venda" placeholder="Ex: 4502" oninput="autoSelect('v_sel', this.value)">
            <label>Produto Selecionado</label><select id="v_sel"></select>
            <label>Quantidade para Vender</label><input type="number" id="v_qtd" value="1">
            <button class="btn-add" style="background:var(--azul)" onclick="addAoCarrinho()">+ ADICIONAR AO PEDIDO</button>
        </div>
        <div id="display_carrinho"></div>
        <div id="cart_total_area" style="display:none">
            <div class="cart-total-box"><small style="color:var(--verde)">TOTAL DO PEDIDO</small><br><strong id="cart_total_val" style="font-size:1.8rem; color:#fff">R$ 0,00</strong></div>
            <button class="btn-add" style="background:var(--roxo); margin-bottom:8px" onclick="finalizarPedido()">💰 FINALIZAR VENDA</button>
            <button class="btn-add" style="background:var(--vermelho)" onclick="limparCarrinho()">🗑️ CANCELAR TUDO</button>
        </div>
    </div>

    <div id="aba3" class="secao">
        <div class="form-box">
            <label>Salão</label><input type="text" id="s_nome">
            <label>Digitar ID da Peça</label><input type="number" id="busca_salao" placeholder="Ex: 4502" oninput="autoSelect('s_sel', this.value)">
            <label>Peça Selecionada</label><select id="s_sel"></select>
            <label>Qtd Enviar</label><input type="number" id="s_qtd" value="1">
            <label>% Comissão</label><input type="number" id="s_com" value="30">
            <button class="btn-add" style="background: var(--azul);" onclick="addS()">🚀 ENVIAR PARA SALÃO</button>
        </div>
        <div id="listaS"></div>
    </div>
</div>

<script>
    // PADRONIZAÇÃO DAS CHAVES PARA dC, dE, dS (COMO NO SEU BACKUP)
    let dC = JSON.parse(localStorage.getItem('dC')) || [];
    let dE = JSON.parse(localStorage.getItem('dE')) || [];
    let dS = JSON.parse(localStorage.getItem('dS')) || {};
    let carrinho = [];
    let idParaTroca = null;

    const m = v => v.toLocaleString('pt-BR', {style: 'currency', currency: 'BRL'});

    function salvarTudo() { 
        localStorage.setItem('dC', JSON.stringify(dC)); 
        localStorage.setItem('dE', JSON.stringify(dE)); 
        localStorage.setItem('dS', JSON.stringify(dS)); 
    }

    function trocar(n, btn) { 
        document.querySelectorAll('.secao').forEach(s => s.classList.remove('active')); 
        document.querySelectorAll('.btn-menu').forEach(b => b.classList.remove('active')); 
        document.getElementById('aba'+n).classList.add('active'); 
        btn.classList.add('active'); 
        render(); 
    }
    
    function autoSelect(idSelect, idDigitado) {
        const sel = document.getElementById(idSelect);
        for (let i = 0; i < sel.options.length; i++) {
            if (sel.options[i].text.startsWith(idDigitado + " -")) {
                sel.selectedIndex = i;
                break;
            }
        }
    }

    function updateCustoReal(index, field, value) {
        let val = parseFloat(value) || 0;
        if(field === 'v') dC[index].v = val;
        if(field === 'q') dC[index].q = val > 0 ? val : 1;
        salvarTudo(); render();
    }

    function addC() { 
        let n = document.getElementById('c_nome').value, v = parseFloat(document.getElementById('c_valor').value), q = parseInt(document.getElementById('c_qtd').value); 
        if(n && v >= 0 && q > 0) { dC.push({n, v, q}); document.getElementById('c_nome').value = ''; document.getElementById('c_valor').value = ''; salvarTudo(); render(); } 
    }

    function sugerir() { let f = getEmbalagemUn(), c = parseFloat(document.getElementById('p_custo').value) || 0; let ma = (parseFloat(document.getElementById('p_margem').value) || 0) / 100; if(c > 0) document.getElementById('p_venda').value = ((c + f) / (1 - (ma >= 1 ? 0.9 : ma))).toFixed(2); }
    function getEmbalagemUn() { let total = 0; dC.forEach(c => { total += (c.v / c.q); }); return total || 0; }
    
    async function addE() { 
        let n = document.getElementById('p_nome').value, q = parseInt(document.getElementById('p_qtd').value), c = parseFloat(document.getElementById('p_custo').value), v = parseFloat(document.getElementById('p_venda').value), f = document.getElementById('p_foto').files[0]; 
        let id = Math.floor(1000 + Math.random() * 9000); 
        let b64 = f ? await comprimirFoto(f) : ""; 
        dE.push({id, n, q, c, v, f: b64}); 
        document.getElementById('p_foto').value = ''; document.getElementById('p_nome').value = '';
        salvarTudo(); render(); 
    }

    function iniciarTrocaFoto(id) { idParaTroca = id; document.getElementById('edit_foto_input').click(); }

    document.getElementById('edit_foto_input').addEventListener('change', async function() {
        if(this.files && this.files[0] && idParaTroca) {
            let b64 = await comprimirFoto(this.files[0]);
            let p = dE.find(x => x.id === idParaTroca);
            if(p) p.f = b64;
            for(let s in dS) { let itemS = dS[s].itens.find(x => x.id === idParaTroca); if(itemS) itemS.f = b64; }
            idParaTroca = null; salvarTudo(); render();
        }
    });

    function abrirZoom(id) {
        let p = dE.find(x => x.id === id);
        if(!p) return;
        document.getElementById('imgGrande').src = p.f;
        document.getElementById('infoGrande').innerHTML = `<strong>${p.n}</strong><small>ID: ${p.id}</small><span>Preço: ${m(p.v)}</span>`;
        document.getElementById('modalFoto').style.display = 'flex';
    }

    function addAoCarrinho() {
        let idx = document.getElementById('v_sel').value, q = parseInt(document.getElementById('v_qtd').value);
        if(idx === "" || q <= 0) return;
        let peca = dE[idx];
        let noCart = carrinho.find(c => c.id === peca.id);
        if(peca.q < (q + (noCart?noCart.q:0))) { alert("Estoque insuficiente!"); return; }
        if(noCart) noCart.q += q; else carrinho.push({ ...peca, q: q });
        document.getElementById('busca_venda').value = '';
        renderCarrinho();
    }

    function renderCarrinho() {
        let html = '', total = 0;
        carrinho.forEach((c, i) => { let sub = c.v * c.q; total += sub; html += `<div class="carrinho-item"><img src="${c.f}" style="width:40px;height:40px;border-radius:4px"><div class="cart-info"><strong>${c.n}</strong><br>${c.q} un x ${m(c.v)}<br><span style="color:var(--verde)">Sub: ${m(sub)}</span></div><button class="btn-del" onclick="carrinho.splice(${i},1);renderCarrinho()">X</button></div>`; });
        document.getElementById('display_carrinho').innerHTML = html;
        document.getElementById('cart_total_val').innerText = m(total);
        document.getElementById('cart_total_area').style.display = carrinho.length > 0 ? 'block' : 'none';
    }

    function finalizarPedido() {
        if(!confirm("Finalizar venda?")) return;
        carrinho.forEach(c => { let p = dE.find(item => item.id === c.id); if(p) p.q -= c.q; });
        carrinho = []; salvarTudo(); render(); renderCarrinho(); alert("Venda realizada!");
    }

    function limparCarrinho() { if(confirm("Limpar pedido?")) { carrinho = []; renderCarrinho(); } }

    function addS() {
        let s = document.getElementById('s_nome').value, idx = document.getElementById('s_sel').value, q = parseInt(document.getElementById('s_qtd').value), com = parseFloat(document.getElementById('s_com').value);
        if(!s || idx === "" || isNaN(com) || q <= 0) return;
        if(dS[s] && dS[s].com !== com) { alert("Comissão fixa desse salão é " + dS[s].com + "%."); return; }
        let peca = dE[idx];
        if(peca.q < q) { alert("Estoque insuficiente!"); return; }
        if(!dS[s]) dS[s] = { itens: [], com: com };
        let it = dS[s].itens.find(i => i.id === peca.id);
        if(it) it.q += q; else dS[s].itens.push({ ...peca, q: q });
        peca.q -= q; 
        document.getElementById('busca_salao').value = '';
        salvarTudo(); render();
    }

    function removerPecaSalao(nomeSalao, idItem) {
        if(!confirm("Remover do salão?")) return;
        let salao = dS[nomeSalao], idx = salao.itens.findIndex(i => i.id === idItem);
        if(idx > -1) { let pE = dE.find(e => e.id === idItem); if(pE) pE.q += salao.itens[idx].q; salao.itens.splice(idx, 1); if(salao.itens.length === 0) delete dS[nomeSalao]; salvarTudo(); render(); }
    }

    function enviarWhatsApp(s) {
        let totalMercadoria = 0; let itensTexto = "";
        dS[s].itens.forEach(it => { totalMercadoria += (it.q * it.v); itensTexto += `💎 *${it.n}* (ID: ${it.id})\nQtd: ${it.q} un | Unit: ${m(it.v)}\n\n`; });
        let txt = `QUINTELLA DIAMOND - ROMANEIO\n📍 Salão: *${s}*\n------------------------------\n${itensTexto}------------------------------\nTotal em Mercadoria: ${m(totalMercadoria)}\nComissão acordada: ${dS[s].com}%\n\nResponsabilidade sobre perda, furto ou danos conforme termo assinado.`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(txt)}`);
    }

    function render() {
        let embUn = getEmbalagemUn(); document.getElementById('fixo').innerText = m(embUn);
        let htmlC = '', subC = 0; dC.forEach((c, i) => { subC += c.v; htmlC += `<tr><td style="padding-left:10px">${c.n}</td><td><input type="number" class="input-edit" value="${c.v}" onchange="updateCustoReal(${i}, 'v', this.value)"></td><td><input type="number" class="input-edit" value="${c.q}" onchange="updateCustoReal(${i}, 'q', this.value)"></td><td>${m(c.v/c.q)}</td><td><button class="btn-del" onclick="dC.splice(${i},1);salvarTudo();render()">X</button></td></tr>`; });
        document.getElementById('listaC').innerHTML = htmlC;
        document.getElementById('subtotal_custos').innerText = "SUBTOTAL INVESTIDO: " + m(subC);
        
        let totE = 0, htmlE = '', htmlCat = '', htmlSel = '<option value="">Escolha...</option>', comSim = (parseFloat(document.getElementById('cat_com').value) || 0) / 100;
        dE.forEach((p, i) => {
            totE += p.q; let custoT = p.c + embUn; let mrg = p.v > 0 ? (((p.v - custoT) / p.v) * 100).toFixed(0) : 0;
            htmlE += `<tr><td><button class="thumb-edit-btn" onclick="iniciarTrocaFoto(${p.id})"><img src="${p.f}" class="thumb"><div class="edit-badge">✎</div></button></td><td><b>${p.n}</b><br><small>ID: ${p.id}</small></td><td>${p.q}</td><td>${custoT.toFixed(2)}</td><td>${p.v.toFixed(2)}</td><td style="color:var(--verde)">${mrg}%</td><td><button class="btn-del" onclick="if(confirm('Apagar?')){dE.splice(${i},1);salvarTudo();render();}">X</button></td></tr>`;
            htmlCat += `<div class="card-cat" onclick="abrirZoom(${p.id})"><img src="${p.f}"><div style="padding:5px"><strong>${p.n}</strong><small>ID: ${p.id}</small><strong>${m(p.v)}</strong><small style="color:var(--verde)">Comissão: ${m(p.v * comSim)}</small></div></div>`;
            if(p.q > 0) htmlSel += `<option value="${i}">${p.id} - ${p.n} (Estoque: ${p.q})</option>`;
        });
        document.getElementById('listaE').innerHTML = htmlE; document.getElementById('listaCat').innerHTML = htmlCat; document.getElementById('totalEst').innerText = totE; 
        document.getElementById('s_sel').innerHTML = htmlSel; document.getElementById('v_sel').innerHTML = htmlSel;

        let htmlS = '';
        for(let s in dS) {
            let rws = ''; 
            dS[s].itens.forEach((it, i) => { 
                rws += `<div class="item-salao"><img src="${it.f}" style="width:45px;height:45px;border-radius:4px;object-fit:cover"><div class="item-info"><span class="nome-label">${it.n}</span><span class="valor-label">ID: ${it.id} </span><span class="unitario-label"> Unit: ${m(it.v)}</span><span class="enviado-label">Quantidade Enviada: ${it.q}</span></div><input type="number" id="v-${s}-${i}" value="0" oninput="recalc('${s}')" class="input-venda"><button class="btn-del" style="margin-left:5px" onclick="removerPecaSalao('${s}', ${it.id})">X</button></div>`; 
            });
            htmlS += `<div class="salao-container"><div class="salao-header" onclick="let el=this.nextElementSibling; el.style.display=el.style.display==='block'?'none':'block'"><span>📍 ${s} | ${dS[s].com}%</span><span>▾</span></div><div style="display:none">${rws}<div style="display:flex;padding:10px;text-align:center;border-top:1px solid #444"><div style="flex:1"><small>Comissão</small><br><strong style="color:var(--vermelho)" id="c-${s}">R$ 0,00</strong></div><div style="flex:1"><small>Receber</small><br><strong style="color:var(--verde)" id="r-${s}">R$ 0,00</strong></div></div><button class="btn-whats" onclick="enviarWhatsApp('${s}')">📱 ENVIAR LISTA WHATSAPP</button><button class="btn-fechar" onclick="fechar('${s}')">FECHAR ACERTO</button></div></div>`;
        }
        document.getElementById('listaS').innerHTML = htmlS;
    }

    function recalc(s) { let b = 0; dS[s].itens.forEach((it, i) => { b += (parseInt(document.getElementById(`v-${s}-${i}`).value) || 0) * it.v; }); let com = b * (dS[s].com / 100); document.getElementById(`c-${s}`).innerText = m(com); document.getElementById(`r-${s}`).innerText = m(b - com); }
    
    function fechar(s) { 
        let erro = false; dS[s].itens.forEach((it, i) => { if((parseInt(document.getElementById(`v-${s}-${i}`).value) || 0) > it.q) erro = true; }); 
        if(erro) { alert("Atenção: A quantidade vendida não pode ser maior que a enviada!"); return; } 
        if(!confirm("Fechar acerto?")) return; 
        dS[s].itens.forEach((it, i) => { let v = parseInt(document.getElementById(`v-${s}-${i}`).value) || 0; let p = dE.find(e => e.id === it.id); if(p) p.q += (it.q - v); }); 
        delete dS[s]; salvarTudo(); render(); 
    }
    
    async function comprimirFoto(f) { 
        return new Promise(res => { 
            const r = new FileReader(); r.readAsDataURL(f); 
            r.onload = e => { 
                const i = new Image(); i.src = e.target.result; 
                i.onload = () => { 
                    const c = document.createElement('canvas'); const m = 600; 
                    let w = i.width, h = i.height; 
                    if(w > h) { if(w > m) { h *= m/w; w = m; } } else { if(h > m) { w *= m/h; h = m; } } 
                    c.width = w; c.height = h; c.getContext('2d').drawImage(i, 0, 0, w, h); 
                    res(c.toDataURL('image/jpeg', 0.8)); 
                }; 
            }; 
        }); 
    }

    function exportar() { const b = new Blob([JSON.stringify({dC, dE, dS})], {type: 'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(b); a.download = 'Backup_Quintella.json'; a.click(); }
    
    <script>
    // ESTA FUNÇÃO VAI LER O SEU ARQUIVO DE QUALQUER JEITO
    function importar(input) {
        const reader = new FileReader();
        reader.onload = (e) => {
            try {
                const data = JSON.parse(e.target.result);
                
                // Aqui está o segredo: ele aceita tanto o nome novo quanto o antigo
                dC = data.QD_V15_C || data.dC || [];
                dE = data.QD_V15_E || data.dE || [];
                dS = data.QD_V15_S || data.dS || {};
                
                // Força o salvamento com os nomes que o seu programa gosta
                localStorage.setItem('QD_V15_C', JSON.stringify(dC));
                localStorage.setItem('QD_V15_E', JSON.stringify(dE));
                localStorage.setItem('QD_V15_S', JSON.stringify(dS));
                
                // Também salva no formato simples para garantir
                localStorage.setItem('dC', JSON.stringify(dC));
                localStorage.setItem('dE', JSON.stringify(dE));
                localStorage.setItem('dS', JSON.stringify(dS));

                render();
                alert("✅ Concluído! " + dE.length + " itens carregados com sucesso.");
            } catch (err) {
                alert("Erro ao ler o arquivo. Certifique-se de que selecionou o Backup_Quintella.json");
            }
        };
        reader.readAsText(input.files[0]);
    }
</script>
</body>
</html>
